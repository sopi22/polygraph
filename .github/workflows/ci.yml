name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    # Linux only, deliberately -- bwrap is a Linux sandboxing primitive
    # (entropy budget: sandbox mechanism = 1), same scope this project
    # already commits to locally. No macOS/Windows runners to test.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install bubblewrap
        run: sudo apt-get update && sudo apt-get install -y bubblewrap

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest -v
